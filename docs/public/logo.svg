<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pg-hybrid-rag logo: three search strands merging inside a database">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5d87"/>
      <stop offset="1" stop-color="#2a8c96"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!-- database cylinder -->
  <path d="M15 17 V45 A17 5.5 0 0 0 49 45 V17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="32" cy="17" rx="17" ry="5.5" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2.5"/>
  <!-- three search legs fusing into one result -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M21 28 C 28 28, 30 35, 37 35" stroke="#f5c451"/>
    <path d="M21 35 H37" stroke="#8be0c8"/>
    <path d="M21 42 C 28 42, 30 35, 37 35" stroke="#ffb3a7"/>
  </g>
  <circle cx="40" cy="35" r="3.5" fill="#ffffff"/>
</svg>
