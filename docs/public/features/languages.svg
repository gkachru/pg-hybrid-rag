  </defs>
  <rect width="120" height="72" rx="12" fill="url(#tile)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans', 'Noto Sans CJK SC', 'Noto Sans Arabic', sans-serif" font-weight="700" text-anchor="middle">
