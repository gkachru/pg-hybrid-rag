<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" role="img" aria-label="A database partitioned by tenant, with a padlock">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5d87"/>
      <stop offset="1" stop-color="#2a8c96"/>
    </linearGradient>
  </defs>
  <rect width="120" height="72" rx="12" fill="url(#tile)"/>
  <!-- cylinder -->
  <path d="M28 16 V56 A22 7 0 0 0 72 56 V16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="50" cy="16" rx="22" ry="7" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2"/>
  <!-- one band per tenant -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M32 29 A18 5.5 0 0 0 68 29" stroke="#f5c451"/>
    <path d="M32 40 A18 5.5 0 0 0 68 40" stroke="#8be0c8"/>
    <path d="M32 51 A18 5.5 0 0 0 68 51" stroke="#ffb3a7"/>
  </g>
  <!-- padlock -->
  <path d="M86 34 V29 A6 6 0 0 1 98 29 V34" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="82" y="34" width="20" height="16" rx="3" fill="#ffffff"/>
  <circle cx="92" cy="40.5" r="2.2" fill="#2f5d87"/>
  <rect x="91" y="41.5" width="2" height="4.5" rx="1" fill="#2f5d87"/>
</svg>
