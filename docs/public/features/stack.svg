<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" role="img" aria-label="A core block with three swappable components plugged in">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5d87"/>
      <stop offset="1" stop-color="#2a8c96"/>
    </linearGradient>
  </defs>
  <rect width="120" height="72" rx="12" fill="url(#tile)"/>
  <!-- connectors -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 36 H46"/>
    <path d="M74 30 H82 V21 H90"/>
    <path d="M74 42 H82 V51 H90"/>
  </g>
  <!-- your components -->
  <rect x="10" y="28" width="20" height="16" rx="4" fill="#8be0c8"/>
  <rect x="90" y="13" width="20" height="16" rx="4" fill="#f5c451"/>
  <rect x="90" y="43" width="20" height="16" rx="4" fill="#ffb3a7"/>
  <!-- the library core -->
  <rect x="46" y="22" width="28" height="28" rx="6" fill="#ffffff"/>
  <rect x="52" y="29" width="16" height="3" rx="1.5" fill="#f5c451"/>
  <rect x="52" y="34.5" width="16" height="3" rx="1.5" fill="#8be0c8"/>
  <rect x="52" y="40" width="16" height="3" rx="1.5" fill="#ffb3a7"/>
  <!-- sockets -->
  <circle cx="46" cy="36" r="2.5" fill="#2f5d87" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="74" cy="30" r="2.5" fill="#2f5d87" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="74" cy="42" r="2.5" fill="#2f5d87" stroke="#ffffff" stroke-width="1.5"/>
</svg>
